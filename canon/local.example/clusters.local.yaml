# canon/local/clusters.local.yaml — real identity for canon/clusters.yaml.
# NEVER COMMITTED to the public repo (canon/local/ is gitignored there).
# Version-controlled separately in the private overlay repo.

updated: 2026-01-01

notify_email: <NOTIFY_EMAIL>      # your Slurm --mail-user
notify_helper: /<CMMG_SCRATCH>/BIN/slurm-notify.sh   # deployed copy of
                 # canon/templates/slurm-notify.sh (added 2026-08-26)

clusters:
  cmmg:
    ssh:
      user: <CLUSTER_USER>
      host: <CMMG_HOST>
      # ALWAYS give the user explicitly (`ssh <CLUSTER_USER>@host`) — L21.
    scratch: /<CMMG_SCRATCH>
    # <CMMG_SCRATCH_ALIAS> is a SYMLINK to /<CMMG_SCRATCH> — same place,
    # two names. Confirmed by the user 2026-07-28. Either path works; the
    # sshfs mount uses /<CMMG_SCRATCH>. This resolves the apparent
    # conflict with the DEVEL/CLAUDE.md note.
    scratch_alias: <CMMG_SCRATCH_ALIAS>
    mount_local:  /Users/<MAC_USER>/cluster-mounts/cmmg
    potentials:   /<CMMG_SCRATCH>/POTENTIALS
    home:         /u/<CLUSTER_USER>           # tight quota; dotfiles/config ONLY

  raven:
    ssh:
      user: <CLUSTER_USER>
      host: <RAVEN_HOST>
    scratch: /ptmp/<CLUSTER_USER>             # confirmed 2026-07-01
    # NB: the $PTMP env var on raven points at the cmmc scratch — wrong
    # machine. Use /ptmp/$USER literally, never $PTMP.
    home: /u/<CLUSTER_USER>
    jupyter: "SSH tunnel script: remote port 30000 -> local 8001"

  viper-cpu:
    ssh:
      user: <CLUSTER_USER>
      host: <VIPER_CPU_HOST>                      # ssh shortname
    scratch: /viper/ptmp1/<CLUSTER_USER>
    home: /u/<CLUSTER_USER>

  viper-gpu:
    ssh:
      user: <CLUSTER_USER>
      host: <VIPER_GPU_HOST>                   # ssh shortname; separate cluster
    scratch: /viper/ptmp2/<CLUSTER_USER>
    home: /u/<CLUSTER_USER>

# Reference material too machine-specific / too personal for the public
